<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Amigurumis da Iara</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">

</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5" style="max-width: 400px; width: 100%;">
            <h3 class="mb-3 text-center">Criar Conta</h3>

            <div class="mb-3">
                <label for="cadastro-email" class="form-label">E-mail</label>
                <input type="email" id="cadastro-email" class="form-control" placeholder="Digite seu e-mail" required>
            </div>

            <div class="mb-3">
                <label for="cadastro-senha" class="form-label">Senha</label>
                <input type="password" id="cadastro-senha" class="form-control" placeholder="Digite uma senha" required>
            </div>

            <button id="btn-cadastrar" class="btn btn-primary w-100">Cadastrar</button>

            <div class="mb-3">
             <p class="text-center mt-3 small">Já tem uma conta? </p>
             <a class="text-center mt-3 small" href="login.html" style="margin-left: 125px;">Entrar</a>
            </div>
        </div>
    </div>

    <!-- Firebase + auth.js -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="js/auth.js"></script>



</body>

</html>
