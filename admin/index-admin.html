<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Painel Administrativo - Amigurumis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">Painel Administrativo - Amigurumis da Iara</h2>

    <!-- Tela de login -->
    <div id="login" class="card shadow p-4 mx-auto" style="max-width: 400px;">
      <h5 class="mb-3">Digite a senha de administrador</h5>
      <input type="password" id="senha" class="form-control mb-3" placeholder="Senha">
      <button onclick="verificarSenha()" class="btn btn-primary w-100">Entrar</button>
    </div>

    <!-- Painel -->
    <div id="painel" style="display: none;">
      <div class="card shadow p-4">
        <h5 class="mb-3">Cadastrar novo produto</h5>
        <form id="form-produto">
          <div class="row g-3">
            <div class="col-md-3">
              <input type="text" id="nome" class="form-control" placeholder="Nome do Produto" required>
            </div>
            <div class="col-md-2">
              <input type="number" id="preco" class="form-control" placeholder="Preço" required>
            </div>
            <div class="col-md-4">
              <input type="url" id="imagem" class="form-control" placeholder="URL da Imagem" required>
            </div>
            <div class="col-md-3">
              <select id="categoria" class="form-select" required>
                <option value="">Categoria</option>
                <option value="Santinhas">Santinhas</option>
                <option value="Pet Realistas">Pet Realistas</option>
                <option value="Kids">Kids</option>
                <option value="Chaveiros">Chaveiros</option>
                <option value="Outros">Diversos</option>
              </select>
            </div>
          </div>
          <div class="text-end mt-3">
            <button type="submit" class="btn btn-success">Salvar Produto</button>
            <button type="button" onclick="limparProdutos()" class="btn btn-outline-danger">Limpar Todos</button>
          </div>
        </form>
      </div>

      <div class="mt-5">
        <h5 class="mb-3">Produtos Cadastrados</h5>
        <ul class="list-group mt-3" id="lista-admin"></ul>
      </div>
    </div>
  </div>

  <script>
    const senhaCorreta = "admin123";

    function verificarSenha() {
      const senha = document.getElementById('senha').value;
      if (senha === senhaCorreta) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('painel').style.display = 'block';
        carregarProdutos();
      } else {
        alert('Senha incorreta!');
      }
    }

    const form = document.getElementById('form-produto');
    const lista = document.getElementById('lista-admin');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const preco = parseFloat(document.getElementById('preco').value);
      const imagem = document.getElementById('imagem').value;
      const categoria = document.getElementById('categoria').value;
      const produto = { nome, preco, imagem, categoria };

      let produtos = JSON.parse(localStorage.getItem('produtos')) || [];
      produtos.push(produto);
      localStorage.setItem('produtos', JSON.stringify(produtos));
      form.reset();
      carregarProdutos();
    });

    function carregarProdutos() {
      lista.innerHTML = '';
      const produtos = JSON.parse(localStorage.getItem('produtos')) || [];

      produtos.forEach((produto, index) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML = `
          <div>
            <strong>${produto.nome}</strong> - R$ ${produto.preco.toFixed(2)}<br>
            <img src="${produto.imagem}" alt="Imagem" style="height: 60px; border-radius: 10px; margin-top: 5px;">
            <br><span class="badge bg-secondary">${produto.categoria || 'Sem Categoria'}</span>
          </div>
          <button class="btn btn-danger btn-sm" onclick="removerProduto(${index})">Remover</button>
        `;
        lista.appendChild(li);
      });
    }

    function removerProduto(index) {
      if (confirm('Tem certeza que deseja remover este produto?')) {
        let produtos = JSON.parse(localStorage.getItem('produtos')) || [];
        produtos.splice(index, 1);
        localStorage.setItem('produtos', JSON.stringify(produtos));
        carregarProdutos();
      }
    }

    function limparProdutos() {
      if (confirm('Tem certeza que deseja apagar TODOS os produtos?')) {
        localStorage.removeItem('produtos');
        carregarProdutos();
      }
    }
  </script>
</body>

</html>
