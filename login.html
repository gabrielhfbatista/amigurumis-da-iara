<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Amigurumis da Iara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style/style.css">


</head> 

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 text-center" style="max-width: 400px;">
            <img src="img/IMG-20230904-WA0029 (1).jpg" alt="Logo Amigurumis da Iara" class="rounded-3 img-fluid mb-4"
                style="max-height: 120px; object-fit: contain;">
            <h4 class="mb-3">Entrar com Google</h3>
            <button id="login-google" class="btn btn-google w-100">
                <img src="https://img.icons8.com/color/16/000000/google-logo.png" class="me-2" /> Entrar com Google
            </button>
            <p class="text-muted mt-3 small">Para acessar sua conta no site</p>
            <div class="mt-4">
                <input type="email" id="email" class="form-control mb-2" placeholder="Seu e-mail">
                <input type="password" id="senha" class="form-control mb-2" placeholder="Sua senha">
                <button class="btn btn-primary w-100 mb-2" onclick="loginComEmailSenha(
              document.getElementById('email').value,
              document.getElementById('senha').value
            )">Entrar com E-mail</button>

                <button class="btn btn-outline-secondary w-100" onclick="cadastrarEmailSenha(
              document.getElementById('email').value,
              document.getElementById('senha').value
            )">Cadastrar</button>
            </div>
        </div>
    </div>



    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <script src="js/auth.js"></script>

</body>

</html>
